name: Build release artifacts

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      publish_npm:
        description: Publish the MCP package to npm after verification
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: npm ci
      - run: npm run check:release
      - run: npm test
      - run: npm run build
      - run: npm run package:standalone
      - run: npm run verify:standalone
      - run: npm pack ./packages/dialoguelab-mcp --pack-destination release
      - name: Publish MCP package
        if: inputs.publish_npm == true
        working-directory: packages/dialoguelab-mcp
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: dialoguelab-${{ github.ref_name }}
          path: release/
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release/*
          generate_release_notes: true
